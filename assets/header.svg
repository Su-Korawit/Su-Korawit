<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Korawit Suporn — C++ and Python developer interested in psychology">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <style>
      .name { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; }
      .sub  { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; }
    </style>
  </defs>
  <rect width="900" height="220" rx="12" fill="url(#bg)"/>
  <g class="mono" font-size="13" fill="#94a3b8" opacity=".55">
    <text x="640" y="48">#include &lt;iostream&gt;</text>
    <text x="640" y="72">def understand(person):</text>
    <text x="640" y="96">    return listen(person)</text>
    <text x="640" y="136">std::cout &lt;&lt; "hello";</text>
    <text x="640" y="160">print("hello")</text>
  </g>
  <text class="name" x="56" y="100" font-size="48" fill="#ffffff">Korawit Suporn</text>
  <rect x="56" y="118" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text class="sub" x="56" y="156" font-size="20" fill="#cbd5e1">C++ and Python developer, interested in how people think</text>
  <text class="sub" x="56" y="184" font-size="15" fill="#94a3b8">Also known as Ikkyusan · SBR School · Thailand</text>
</svg>
